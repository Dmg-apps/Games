name: Publicar Vidas en GitHub Pages
on:
  push:
    # Se publica desde la rama por defecto del repositorio (GitHub solo permite esa)
    branches: [claude/serene-turing-3n3j49]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # 1) Prepara los archivos de la web
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: simulacion
  # 2) Los publica (en un paso aparte, así GitHub ya ve el paquete subido)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
