<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6a8bff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Simulación">
  <meta name="description" content="Juegos de simulación para el móvil: Vidas, Parque Salvaje, Arrecife y más.">
  <title>Simulación</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="shared/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/ui.css">
  <style>
    html, body { overflow: auto; height: auto; min-height: 100dvh; }
    body { background: radial-gradient(120% 80% at 10% 0%, #dfe6ff 0%, #f4f1ff 45%, #eaf7f3 100%); padding: calc(var(--safe-t) + 22px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 28px) calc(var(--safe-l) + 18px); }
    header.top { display: flex; align-items: center; gap: 14px; max-width: 960px; margin: 0 auto 18px; }
    header.top img { width: 52px; height: 52px; border-radius: 16px; box-shadow: var(--shadow); }
    header.top h1 { margin: 0; font-size: 30px; font-weight: 1000; letter-spacing: -0.02em; }
    header.top p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 960px; margin: 0 auto; }
    .game { position: relative; display: flex; flex-direction: column; border-radius: 26px; overflow: hidden; background: #fff; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); transition: transform 160ms var(--ease-out), box-shadow 200ms ease; }
    .game:active { transform: scale(0.98); }
    .game .art { height: 150px; position: relative; overflow: hidden; display: grid; place-items: center; }
    .game .art .big { font-size: 64px; color: #fff; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.2)); }
    .game .art .deco { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.18); }
    .game .body { padding: 14px 16px 16px; }
    .game h2 { margin: 0; font-size: 20px; font-weight: 900; }
    .game p { margin: 4px 0 10px; color: var(--ink-2); font-size: 13.5px; line-height: 1.4; }
    .game .prog { display: flex; gap: 6px; flex-wrap: wrap; }
    .game .play { position: absolute; right: 14px; top: 118px; width: 52px; height: 52px; border-radius: 18px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 22px; box-shadow: 0 8px 18px rgba(31,37,64,0.3); }
    .game .hostbadge { position: absolute; left: 14px; top: 96px; width: 54px; height: 54px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; box-shadow: 0 6px 14px rgba(31,37,64,0.25); }
    .game .hostbadge .avatar { width: 100%; height: 100%; display: block; }
    .game.soon { opacity: 0.75; pointer-events: none; }
    .game.soon .art { background: repeating-linear-gradient(45deg, #e6e3f0 0 14px, #eeebf6 14px 28px); }
    .game.soon .art .big { color: #a8a2c0; }
    .account { max-width: 960px; margin: 18px auto 0; background: #fff; border-radius: 26px; box-shadow: var(--shadow); padding: 4px 16px 16px; }
    .account .inner { max-width: 440px; }
    footer { max-width: 960px; margin: 22px auto 0; color: var(--ink-3); font-size: 12.5px; text-align: center; line-height: 1.5; }
    @media (hover: hover) and (pointer: fine) { .game:hover { transform: translateY(-3px); box-shadow: var(--shadow-l); } }
  </style>
</head>
<body>
  <header class="top">
    <img src="icons/icon-192.png" alt="">
    <div><h1>Simulación</h1><p>Elige un mundo y hazlo crecer.</p></div>
  </header>
  <main class="games" id="games"></main>
  <section class="account"><div class="sec" id="cloudttl"></div><div class="inner" id="cloud"></div></section>
  <footer>Las partidas se guardan en este móvil y funcionan sin conexión. Con una cuenta, todas se guardan también en la nube.<br>Pronto llegarán más juegos.</footer>
  <script type="module" src="hub.js"></script>
</body>
</html>
